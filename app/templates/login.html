{% extends "base.html" %}
{% block title %}登录 · ScheduleKit{% endblock %}
{% block body_class %}page-login{% endblock %}

{# 登录页不显示导航（还没登录） #}
{% block topbar %}{% endblock %}

{% block body %}
<main class="login-card">
  <h1>ScheduleKit</h1>
  {% if request.query_params.get("error") %}
    <p class="login-error" role="alert">密码错误，请重试。</p>
  {% endif %}
  <form method="post" action="/api/login" autocomplete="current-password">
    <label for="password">管理员密码</label>
    <input id="password" name="password" type="password" required autofocus
           autocomplete="current-password" inputmode="text">
    <button type="submit">登录</button>
  </form>
</main>
{% endblock %}
