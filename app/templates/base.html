<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}ScheduleKit{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ScheduleKit">
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

{# 顶栏统一在这里渲染：品牌名本身也是回主页的入口。
   登录页把整个 topbar 区块覆写为空。 #}
{% block topbar %}
<header class="topbar">
  <a class="topbar__brand" href="/" title="返回主页">ScheduleKit</a>
  <span class="spacer"></span>
  {% include "_nav.html" %}
</header>
{% endblock %}

{% block body %}{% endblock %}
<script src="/static/js/app.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
